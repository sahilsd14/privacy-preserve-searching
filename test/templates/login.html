<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">

</head>

<body>
<div class="container">
<h2>🔐 Login</h2>

<form method="POST">

</form>

<p>New user? <a href="/register">Register</a></p>
</div>
</body>
</html>
